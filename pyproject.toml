[project]
name = "cjp"
version = "0.1.0"
description = "LLM triage of Wazuh alerts from OWASP Juice Shop traffic (IFN737/IFN738 research pipeline)"
requires-python = ">=3.12,<3.13"
# Lower bounds are the versions the legacy scripts last ran with (old venv, 2026-09-30).
# uv.lock pins the exact resolved set; change deps with `uv add` / `uv lock`, never by hand.
dependencies = [
    "anthropic>=1.9.0,<2",  # 1.x since 30 Sep (httpx2 underneath; httpx below is for Wazuh only)
    "fastapi>=0.142.2",  # web app API, served by `cjp ui` (Plan P6)
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",  # paired cluster bootstrap for the contrasts (P5); was already in via matplotlib
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",  # experiment YAMLs and results/canonical.yaml (P2.4)
    "rich>=15.0.0",
    "urllib3>=2.6.3",
    "uvicorn>=0.54.0",  # the one local server process behind `cjp ui` (Plan P6)
]

[project.scripts]
cjp = "cjp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cjp", "web"]

[tool.uv]
# Installs `cjp` into .venv in editable mode, so `cjp …` runs the working tree.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
